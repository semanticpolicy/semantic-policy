name: release

# Publishes the packages to nuget.org when a v* tag is pushed. There is no API key in the repository:
# nuget.org trusts this workflow through a Trusted Publishing policy (owner SemanticPolicy, repository
# semanticpolicy/semantic-policy, workflow release.yml, environment release) and hands the job a key
# that lives one hour. NUGET_USER is the nuget.org profile name of a member of that organization.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check the tag names the version
        run: |
          version=$(dotnet msbuild src/SemanticPolicy.Core/SemanticPolicy.Core.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props"
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
